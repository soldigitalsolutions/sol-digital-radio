<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sol Digital Radio - Jukebox Center</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FCD116">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icon-192.png">

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor General tipo Gabinete de Rocola -->
    <div class="jukebox-cabinet">
        
        <!-- Pantalla / Cabecera Principal -->
        <header class="cabinet-header">
            <div class="brand-title">
                <h1><i class="fa-solid fa-compact-disc"></i> Sol Digital Radio</h1>
                <span class="subtitle">Jukebox Center &bull; By EPamar</span>
            </div>
            <div class="server-status-pill" id="serverStatusIndicator">
                <span class="dot"></span> <span id="statusText">Rocola Lista</span>
            </div>
        </header>

        <!-- Contenedor Principal (Dashboard Adaptable PC / Móvil) -->
        <div class="cabinet-main-layout">
            
            <!-- PANEL IZQUIERDO: Consola de Reproducción (Pantalla de la Rocola) -->
            <section class="console-screen-panel">
                <div class="virtual-screen">
                    <div class="screen-header-bar">
                        <span><i class="fa-solid fa-tower-broadcast"></i> EN TRANSMISIÓN</span>
                        <span class="live-badge-mini"><span class="pulse-dot"></span> LIVE</span>
                    </div>
                    
                    <div class="screen-content">
                        <!-- Portada / Logo de la Emisora Activa -->
                        <div class="station-cover-frame" id="stationCoverFrame">
                            <img id="stationLogoImg" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80" alt="Logo Emisora">
                            <div class="equalizer-overlay">
                                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                            </div>
                        </div>

                        <!-- Información de la Emisora -->
                        <div class="station-info-display">
                            <h2 id="currentTrackTitle">Selecciona una Emisora</h2>
                            <p id="currentTrackCategory">Catálogo Sol Digital</p>
                        </div>
                    </div>

                    <!-- Controles de Reproducción (Anterior, Play/Pause, Siguiente) -->
                    <div class="screen-controls-deck">
                        <div class="volume-box">
                            <i class="fa-solid fa-volume-low"></i>
                            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
                            <i class="fa-solid fa-volume-high"></i>
                        </div>

                        <div class="playback-buttons-group">
                            <button id="prevBtn" class="deck-btn" title="Emisora Anterior"><i class="fa-solid fa-backward-step"></i></button>
                            <button id="playPauseBtn" class="deck-btn play-main-btn" title="Reproducir / Pausa">
                                <i class="fa-solid fa-play" id="playIcon"></i>
                            </button>
                            <button id="nextBtn" class="deck-btn" title="Emisora Siguiente"><i class="fa-solid fa-forward-step"></i></button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- PANEL DERECHO: Directorio y Selector de Emisoras por Categorías -->
            <section class="directory-panel">
                <div class="directory-tabs">
                    <button class="dir-tab active" data-category="all">Todas</button>
                    <button class="dir-tab" data-category="colombia">🇨🇴 Colombia</button>
                    <button class="dir-tab" data-category="internacional">🌍 Internacional</button>
                    <button class="dir-tab" data-target-view="adminView"><i class="fa-solid fa-plus"></i> Añadir</button>
                </div>

                <!-- Lista de Emisoras en Tarjetas (Grid Visual) -->
                <div class="stations-catalog-grid" id="stationsCatalogGrid">
                    <!-- Se inyecta dinámicamente con JS -->
                </div>

                <!-- Vista de Gestión / Añadir Emisora (Oculta por defecto hasta presionar Añadir) -->
                <div id="adminViewModal" class="admin-modal hidden">
                    <div class="admin-card">
                        <h3><i class="fa-solid fa-plus-circle"></i> Agregar Emisora a la Rocola</h3>
                        <div class="form-group">
                            <label>Nombre de la Emisora</label>
                            <input type="text" id="inputStationName" placeholder="Ej: Tropicana Bogotá">
                        </div>
                        <div class="form-group">
                            <label>Categoría</label>
                            <select id="inputStationCategory" class="styled-select">
                                <option value="colombia">Radios de Colombia</option>
                                <option value="internacional">Radios Internacionales</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>URL del Stream (HTTPS directo)</label>
                            <input type="url" id="inputStreamUrl" placeholder="https://audio.emisora.com/stream">
                        </div>
                        <div class="form-group">
                            <label>URL de la Portada / Logo (Opcional)</label>
                            <input type="url" id="inputStationLogo" placeholder="https://imagen.com/logo.png">
                        </div>
                        <div class="admin-actions">
                            <button id="addStationBtn" class="btn-primary">Guardar en la Rocola</button>
                            <button id="closeModalBtn" class="btn-secondary">Volver</button>
                        </div>
                    </div>
                </div>
            </section>

        </div>

        <!-- Franja Tricolor de Colombia (Ubicación Inferior) -->
        <div class="colombia-flag-bar">
            <div class="stripe yellow"></div>
            <div class="stripe blue"></div>
            <div class="stripe red"></div>
        </div>

        <!-- Firma Oficial Inferior -->
        <footer class="cabinet-footer">
            <div class="signature-content">
                <span class="brand-signature">Sol Digital Solutions <span class="by-text">by</span> <span class="epamar-text">EPamar</span></span>
                <p class="copyright">&copy; 2025 - 2026 &bull; Todos los derechos reservados</p>
            </div>
        </footer>

    </div>

    <!-- Audio Oculto -->
    <audio id="audioStream" preload="none"></audio>
    <script src="app.js"></script>
</body>
</html>
